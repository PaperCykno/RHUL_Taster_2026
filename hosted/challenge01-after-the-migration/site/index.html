<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    RHUL CSS Taster Portal
  </title>

  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color: #17202a;
      background: #f4f6f8;
    }

    body {
      margin: 0;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #dde2e7;
      padding: 18px 28px;
      font-weight: 700;
    }

    main {
      max-width: 760px;
      margin: 70px auto;
      background: #fff;
      border: 1px solid #e1e5ea;
      border-radius: 14px;
      padding: 34px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #edf1f5;
      font-size: 13px;
      margin-bottom: 18px;
    }

    p {
      line-height: 1.6;
    }

    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 34px 50px;
      color: #68737d;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    RHUL Cyber Security Society
  </header>

  <main>
    <span class="status">
      Portal retired
    </span>

    <h1>
      Freshers Taster Portal
    </h1>

    <p>
      Registration for this event has closed.
    </p>

    <p>
      The previous event portal was migrated to the current society
      event system. This copy remains online for compatibility with
      older links.
    </p>
  </main>

  <footer>
    RHUL CSS event services
  </footer>
</body>
</html>
